<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Osakehaku</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Oma tyyli -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap container">
    <!-- Otsikko -->
    <header class="hero text-center">
      <h1 class="mb-2">Osakehaku</h1>
      <p class="lead">
        Hae yrityksen perustiedot ja viimeisin hinta symbolilla
      </p>
    </header>

    <!-- Haku -->
    <section class="search-area">
      <form id="hakulomake" novalidate>
        <div class="search-bar">
          <input
            id="syote"
            type="text"
            placeholder="Syötä symboli… (AAPL)"
            required
          />
          <button type="submit" class="btn btn-primary">Hae</button>
        </div>
      </form>

      <!-- Esimerkkisymbolien pikavalinta -->
      <div class="quick-symbols" aria-label="Nopea symbolivalinta">
        <span class="quick-label">Esimerkkejä:</span>
        <button type="button" class="quick-btn" data-symbol="AAPL">AAPL</button>
        <button type="button" class="quick-btn" data-symbol="MSFT">MSFT</button>
        <button type="button" class="quick-btn" data-symbol="TSLA">TSLA</button>
        <button type="button" class="quick-btn" data-symbol="AMZN">AMZN</button>
        <button type="button" class="quick-btn" data-symbol="META">META</button>
        <button type="button" class="quick-btn" data-symbol="GOOG">GOOG</button>
      </div>

      <!-- Lataus merkki -->
      <div id="loader" class="text-center mt-3 piilossa">
        <div class="spinner-border text-primary" role="status"></div>
      </div>

      <!-- Virheilmoitus -->
      <p id="error" role="alert" aria-live="polite"></p>

      <!-- API-kutsujen laskuri -->
      <p id="api-count" class="api-count">
        API-kutsuja tällä sessiolla: 0
      </p>
    </section>

    <!-- Osakkeen perustiedot -->
    <section id="tulos" class="card piilossa" aria-live="polite">
      <div class="card-header">
        <div id="logo" class="logo"></div>
        <div class="title">
          <h2 id="nimi">—</h2>
          <span id="symboli" class="chip">—</span>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <span class="label">Ala</span>
          <span id="sektori">—</span>
        </div>
        <div class="field">
          <span class="label">Pörssi</span>
          <span id="porssi">—</span>
        </div>
        <div class="field">
          <span class="label">Valuutta</span>
          <span id="valuutta">—</span>
        </div>
        <div class="field large">
          <span class="label">Nykyinen hinta</span>
          <span id="hinta" class="price">—</span>
          <span id="hintamuutos" class="price-change"></span>
        </div>
        <div class="field">
          <span class="label">Vaihto</span>
          <span id="vaihto">—</span>
        </div>
      </div>

      <details class="desc">
        <summary>Yrityksen kuvaus</summary>
        <p id="kuvaus">—</p>
      </details>
    </section>

    <!-- Footteri -->
    <footer class="footer text-center">
      <small>
        Osaketiedot haettu
        <a href="https://financialmodelingprep.com/" target="_blank" rel="noopener"
          >täältä</a
        >.
      </small>
    </footer>
  </main>

  <!-- Kirjastot -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Oma skripti -->
  <script src="script.js"></script>
</body>
</html>
